name: VXB Aerospace
description: VXB Aerospace is an Australian space technology company founded in 2022
  by Alexander Ryan, developing generative design software and Hall-effect plasma
  propulsion for the satellite market. Its platform automates the design, manufacturability
  analysis, multi-physics modeling and validation of complex aerospace hardware such
  as propulsion systems, antennas and satellite layouts, while its ZEPHYR-35 Hall-effect
  thruster (Argon/Krypton/Xenon) provides in-orbit mobility, refueling, servicing and
  de-orbiting. The company was surfaced as a Techstars portfolio lead and enriched in
  the API Evangelist network; it publishes no public developer API, SDK, or documentation
  surface at this time.
